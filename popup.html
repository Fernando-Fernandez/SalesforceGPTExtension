<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT for Salesforce</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>GPT for Salesforce</h1>
    <span id="error"></span>

    <ul class="tabs" role="tablist">
      <li>
        <input type="radio" name="tabs" class="tab" id="tab2" checked />
        <label for="tab2" class="tab" role="tab" aria-selected="true" aria-controls="panel2" tabindex="0">Ask GPT</label>
        <div id="tab-content2" class="tab-content" role="tabpanel" aria-labelledby="askGPT">

          <label for="gptQuestion">Question (leave blank for default):</label>
          <input id="gptQuestion" type="text" placeholder="Ask something about this page…" />

          <label for="gpt-version">Model:</label>
          <select id="gpt-version">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4.1">GPT-4.1</option>
            <option value="gpt-5-mini">GPT-5 mini</option>
            <option value="gpt-5-nano">GPT-5 nano</option>
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            <option value="custom">Custom…</option>
          </select>
          <div id="custom-model-wrapper">
            <input id="custom-model" type="text" placeholder="Enter model name…" />
          </div>

          <button id="sendToGPT">Ask GPT to Explain</button>

          <div id="spinner" class="lds-dual-ring"></div>
          <span id="response"></span>

        </div>
      </li>
      <li>
        <input type="radio" name="tabs" id="tab1" class="tab" />
        <label for="tab1" class="tab" role="tab" aria-selected="false" aria-controls="panel1" tabindex="0">OpenAI Key</label>
        <div id="tab-content1" class="tab-content" role="tabpanel" aria-labelledby="openAIKey">

          <label for="openAIKey">Enter your OpenAI key:</label>
          <input id="openAIKey" type="password" name="openAIKey" placeholder="sk-…" />
          <button id="setKey">Save Key</button>

        </div>
      </li>
    </ul>

    <script src="./scripts/popup.js" type="module"></script>
  </body>
</html>
